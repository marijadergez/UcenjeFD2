<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form grid questions</title>
    <link rel="stylesheet" href="style.css">
 

</head>

 <header class="header">
        
        <h2>Otvoriti Developer tools
           (F12 ili desni klik pa Inspect - provjeri)</h2>
           <br>
        <p>Odaberite zadatak, unesi vrijednosti <strong>A | B</strong> (ovisno o zadatku) i klikni <strong>Izvrši</strong>.</p>
      </header>
<body>
  <div class="app-wrapper">



    <select class="form-select" aria-label="Default select example">
  <option selected>1. Izračun površine pravokutnika</option>
  <option value="2">2. Provjera je li broj pozitivan, negativan ili nula</option>
  <option value="3">3. Zbroj elemenata niza</option>
  <option value="4">4. Prosjek ocjena</option>
  <option value="5">5. Ispis Fibonaccijevog niza</option>
  <option value="6">6. Preokret stringa</option>
  <option value="7">7. Brojanje samoglasnika</option>
  <option value="8">8. Pretvorba temperature</option>
  <option value="9">9. Sortiranje niza</option>
  <option value="10">10. Kalkulator</option>
</select>


  <div class="form-wrapper">
  <div class="mb-3">
    <label class="form-label">A</label>
    <input type="text" class="form-control" id="inputA" placeholder="">
  </div>

  <div class="mb-3">
    <label class="form-label">B</label>
    <input type="text" class="form-control" id="inputB" placeholder="">
  </div>
</div>
<button id="btnUnesi" class="myButton">Izvrši</button>

<p id="rezultat"></p>
<div id="rezultat" class="result" aria-live="polite">Ovdje će ce pokazati rezultat</div>



<small>♻️Predložak zadaci za Edunovu  frontend developer</small>
</div>
<script src="script.js"></script>






</body>
</html>

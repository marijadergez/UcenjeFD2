<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form grid questions</title>
    <link rel="stylesheet" href="style.css">
 

</head>

 <header class="header">
        
        <h2>Otvoriti Developer tools
           (F12 ili desni klik -Inspect)</h2>
           <br>
        <p>Odaberite zadatak, unesi vrijednosti u: <strong>A | B</strong> (ovisno o zadatku) i klikni <strong>Izvrši</strong>.</p>
      </header>
<body>
  <div class="app-wrapper">



    <select class="form-select" aria-label="Default select example">
  <option value="1">1. U polje A unesi širinu, a u polje B dužinu i doznaj površinu pravokutnika</option>
  <option value="2">2. Unesi broj u polje A i saznaj dali je : pozitivan, negativan ili nula.</option>
  <option value="3">3. Zbroj elemenata niza</option>
  <option value="4">4. U polje A upiši koliko ima ocjena, a u polje B - zbroj tih svih ocjena</option>
  <option value="5">5. Ispis Fibonaccijevog niza</option>
  <option value="6">6. Ispiši riječ u polje A i otkrij kako ona glasi naopako.</option>
  <option value="7">7. Brojanje samoglasnika</option>
  <option value="8">8. Pretvorba temperature</option>
  <option value="9">9. Sortiranje niza uzlazno iz polja A</option>
  <option value="10" selected>10. Kalkulator</option>
  <option value="11">11.Generiraj lozinku sa: Uključena/isključena velika slova</option>
  <option value="12">12. Generiraj lozinku sa: Uključena/isključena mala slova </option>
</select>


  <div class="form-wrapper">
  <div class="mb-3">
    <label class="form-label">A</label>
    <input type="text" class="form-control" id="inputA" placeholder="">
  </div>
  

  <div class="mb-3">
    <label class="form-label">B</label>
    <input type="text" class="form-control" id="inputB" placeholder="">
  </div>
</div>
<br>

<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
  <label class="form-check-label" for="checkIndeterminate">
    Generator za lozinke- checkbox
  </label>
</div>


<button id="btnUnesi" class="myButton">Izvrši</button>




<div id="rezultat" class="result" aria-live="polite">Rezultat :</div>



<small>♻️ -Predložak - zadaci za Edunovu  frontend developer 2026.</small>
</div>
<script src="script.js"></script>






</body>
</html>
